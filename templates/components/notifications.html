{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="notifications" role="status" aria-live="polite">
      {% for category, message in messages %}
        <div class="alert {{ 'alert-error' if category == 'error' else 'alert-success' }}" data-dismissible>
          <p class="alert-body">{{ message }}</p>
          <button type="button" class="alert-dismiss" data-dismiss aria-label="Dismiss notification">×</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
