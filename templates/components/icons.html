{# Minimal inline SVG icons (24x24, stroke = currentColor). Usage: {{ icon('download') }} #}
{% macro icon(name, label=None) -%}
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"
     stroke-linecap="round" stroke-linejoin="round" {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true"{% endif %}>
{%- if name == 'dashboard' %}<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
{%- elif name == 'lesson' %}<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/><path d="M9 7.5h7M9 11h5"/>
{%- elif name == 'calendar' %}<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7.5 13.5h3M13.5 13.5h3M7.5 17h3"/>
{%- elif name == 'library' %}<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>
{%- elif name == 'menu' %}<path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif name == 'close' %}<path d="M6 6l12 12M18 6L6 18"/>
{%- elif name == 'download' %}<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/>
{%- elif name == 'upload' %}<path d="M12 15.5V4.5M7.5 9L12 4.5 16.5 9M5 19.5h14"/>
{%- elif name == 'print' %}<path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="7.5" rx="1.5"/><path d="M7 14h10v6.5H7z"/>
{%- elif name == 'edit' %}<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14 8l2.5 2.5"/>
{%- elif name == 'trash' %}<path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l.8 12.5h9.4L17.5 7M10 11v5M14 11v5"/>
{%- elif name == 'refresh' %}<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/>
{%- elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'lock' %}<rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
{%- elif name == 'check' %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == 'arrow' %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'swap' %}<path d="M7 7h12l-3.5-3.5M17 17H5l3.5 3.5"/>
{%- elif name == 'file' %}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>
{%- endif -%}
</svg>
{%- endmacro %}
